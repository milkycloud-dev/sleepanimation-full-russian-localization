# Скорость пропуска времени во время анимации сна (в тиках за игровой тик)
# Большие значения = быстрее анимация
# По умолчанию: 50
skip-speed: 50

# Должны ли игроки мгновенно выталкиваться из постели при начале анимации
# Если false, игроки остаются в постели на протяжении всей анимации
# По умолчанию: false
instant-wakeup: false
